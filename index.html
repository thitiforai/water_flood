<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Monitoring Dashboard (Google Maps)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Sidebar Styles */
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
    </style>
</head>
<body class="relative">

    <!-- Sidebar UI (เหมือนเดิม) -->
    <div class="sidebar p-5 flex flex-col gap-6">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2 text-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
                Flood Monitor
            </h1>
            <p class="text-xs text-gray-500 mt-1">Live status monitoring (Google Maps)</p>
        </div>

        <div class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Location</h2>
            <select id="provinceSelect" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <option value="all">ทุกจังหวัด</option>
                <option value="rayong">ระยอง (Rayong)</option>
                <option value="chonburi">ชลบุรี (Chonburi)</option>
            </select>
            <select id="districtSelect" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none" disabled>
                <option value="all">ทุกอำเภอ</option>
            </select>
        </div>

        <div class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Filter by Severity</h2>
            <label class="flex items-center justify-between p-3 bg-red-50 rounded-lg cursor-pointer border border-red-100 hover:bg-red-100 transition">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="severity-filter w-4 h-4 text-red-600 rounded" value="heavy" checked>
                    <div class="w-4 h-4 rounded-full bg-red-500 border-2 border-white shadow-sm"></div>
                    <span class="text-sm font-medium text-red-900">Heavy Flood</span>
                </div>
                <span class="text-xs font-bold text-white bg-red-500 px-2 py-1 rounded-full" id="count-heavy">0</span>
            </label>
            <!-- ซ่อน Flooded / Warning ไว้เพื่อความกระชับ (สามารถเติมได้แบบเดิม) -->
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- 1. โหลดไฟล์ config.js ที่มี API Key เข้ามาก่อน -->
    <script src="config.js"></script>

    <script>
        let map;
        let activeMarkers = []; // เก็บหมุดปัจจุบันเพื่อลบออกเวลาเปลี่ยนฟิลเตอร์

        // ข้อมูลจำลอง (Mock Data)
        const districtsData = {
            rayong: [{ id: "mueang", name: "เมืองระยอง" }, { id: "pluak_daeng", name: "ปลวกแดง" }],
            chonburi: [{ id: "mueang", name: "เมืองชลบุรี" }, { id: "bang_lamung", name: "บางละมุง" }]
        };

        const allFloodPoints = [
            { lat: 12.68, lng: 101.28, province: "rayong", district: "mueang", severity: "heavy", name: "แยก PMY" },
            { lat: 12.98, lng: 101.21, province: "rayong", district: "pluak_daeng", severity: "heavy", name: "นิคมอุตสาหกรรม" },
            { lat: 12.93, lng: 100.88, province: "chonburi", district: "bang_lamung", severity: "heavy", name: "พัทยากลาง" }
        ];

        // ฟังก์ชันสร้างหน้าตาหมุดตามความรุนแรง
        function getMarkerStyle(severity) {
            let color = severity === 'heavy' ? '#ef4444' : '#f97316';
            let size = severity === 'heavy' ? 12 : 8;
            return {
                path: google.maps.SymbolPath.CIRCLE,
                fillColor: color,
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 2,
                scale: size
            };
        }

        // อัปเดต Dropdown อำเภอ
        function updateDistrictDropdown(province) {
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.innerHTML = '<option value="all">ทุกอำเภอ</option>';
            if (province === 'all') {
                districtSelect.disabled = true;
                return;
            }
            districtSelect.disabled = false;
            districtsData[province].forEach(d => {
                districtSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
            });
        }

        // ฟังก์ชันวาดแผนที่และตัวกรอง
        function renderMapData() {
            const selectedProvince = document.getElementById('provinceSelect').value;
            const selectedDistrict = document.getElementById('districtSelect').value;
            const activeSeverities = Array.from(document.querySelectorAll('.severity-filter:checked')).map(cb => cb.value);

            // ลบหมุดเก่าออกจากแผนที่
            activeMarkers.forEach(marker => marker.setMap(null));
            activeMarkers = [];

            let filteredPoints = allFloodPoints;
            let bounds = new google.maps.LatLngBounds();
            let hasPoints = false;

            // กรองข้อมูล
            if (selectedProvince !== 'all') filteredPoints = filteredPoints.filter(p => p.province === selectedProvince);
            if (selectedDistrict !== 'all' && selectedProvince !== 'all') filteredPoints = filteredPoints.filter(p => p.district === selectedDistrict);
            
            // อัปเดตตัวเลข (แบบง่าย)
            let heavyCount = filteredPoints.filter(p => p.severity === 'heavy').length;
            document.getElementById('count-heavy').innerText = heavyCount;

            filteredPoints = filteredPoints.filter(p => activeSeverities.includes(p.severity));

            // วาดหมุดใหม่
            filteredPoints.forEach(p => {
                hasPoints = true;
                const marker = new google.maps.Marker({
                    position: { lat: p.lat, lng: p.lng },
                    map: map,
                    icon: getMarkerStyle(p.severity),
                    title: p.name
                });
                
                // เพิ่ม Popup (InfoWindow)
                const infoWindow = new google.maps.InfoWindow({ content: `<b>${p.name}</b>` });
                marker.addListener("click", () => infoWindow.open(map, marker));

                activeMarkers.push(marker);
                bounds.extend(new google.maps.LatLng(p.lat, p.lng));
            });

            // ซูมแผนที่ให้พอดีกับจุด
            if (hasPoints) map.fitBounds(bounds);
        }

        // ผูก Events
        document.getElementById('provinceSelect').addEventListener('change', (e) => {
            updateDistrictDropdown(e.target.value);
            renderMapData();
        });
        document.getElementById('districtSelect').addEventListener('change', renderMapData);
        document.querySelectorAll('.severity-filter').forEach(cb => cb.addEventListener('change', renderMapData));

        // ฟังก์ชันเริ่มต้น (Callback จาก Google Maps)
        window.initMap = function() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 12.8, lng: 101.1 },
                zoom: 9,
                mapTypeControl: false,
                styles: [ // ทำให้แผนที่เป็นสีเทาอ่อน สบายตา
                    { featureType: "water", stylers: [{ color: "#d3d3d3" }] },
                    { featureType: "landscape", stylers: [{ color: "#f5f5f5" }] }
                ]
            });
            renderMapData();
        };

        // 2. โค้ดสร้าง Script ของ Google Maps แบบไดนามิก (ดึง Key จาก config.js มาใส่)
        if (CONFIG && CONFIG.GOOGLE_MAPS_API_KEY) {
            let script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        } else {
            alert("ไม่พบ API Key กรุณาตรวจสอบไฟล์ config.js");
        }
    </script>
</body>
</html>
