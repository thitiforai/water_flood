<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Monitoring Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Sidebar Styles */
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        /* Custom Marker Styles */
        .flood-marker {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .marker-heavy { background-color: #ef4444; width: 24px; height: 24px; }
        .marker-flooded { background-color: #f97316; width: 18px; height: 18px; }
        .marker-warning { background-color: #eab308; width: 14px; height: 14px; }
    </style>
</head>
<body class="relative">

    <!-- Sidebar UI -->
    <div class="sidebar p-5 flex flex-col gap-6">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2 text-gray-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                </svg>
                Flood Monitor
            </h1>
            <p class="text-xs text-gray-500 mt-1">Live status monitoring dashboard</p>
        </div>

        <!-- Location Filter -->
        <div class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Location</h2>
            
            <select id="provinceSelect" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
                <option value="all">ทุกจังหวัด</option>
                <option value="rayong">ระยอง (Rayong)</option>
                <option value="chonburi">ชลบุรี (Chonburi)</option>
            </select>

            <select id="districtSelect" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none" disabled>
                <option value="all">ทุกอำเภอ</option>
            </select>
        </div>

        <!-- Severity Filter -->
        <div class="flex flex-col gap-3">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Filter by Severity</h2>
            
            <label class="flex items-center justify-between p-3 bg-red-50 rounded-lg cursor-pointer border border-red-100 hover:bg-red-100 transition">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="severity-filter w-4 h-4 text-red-600 rounded" value="heavy" checked>
                    <div class="w-4 h-4 rounded-full bg-red-500 border-2 border-white shadow-sm"></div>
                    <span class="text-sm font-medium text-red-900">Heavy Flood</span>
                </div>
                <span class="text-xs font-bold text-white bg-red-500 px-2 py-1 rounded-full" id="count-heavy">0</span>
            </label>

            <label class="flex items-center justify-between p-3 bg-orange-50 rounded-lg cursor-pointer border border-orange-100 hover:bg-orange-100 transition">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="severity-filter w-4 h-4 text-orange-500 rounded" value="flooded" checked>
                    <div class="w-3.5 h-3.5 rounded-full bg-orange-500 border-2 border-white shadow-sm"></div>
                    <span class="text-sm font-medium text-orange-900">Flooded</span>
                </div>
                <span class="text-xs font-bold text-white bg-orange-500 px-2 py-1 rounded-full" id="count-flooded">0</span>
            </label>

            <label class="flex items-center justify-between p-3 bg-yellow-50 rounded-lg cursor-pointer border border-yellow-100 hover:bg-yellow-100 transition">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="severity-filter w-4 h-4 text-yellow-400 rounded" value="warning" checked>
                    <div class="w-3 h-3 rounded-full bg-yellow-400 border-2 border-white shadow-sm"></div>
                    <span class="text-sm font-medium text-yellow-900">Warning</span>
                </div>
                <span class="text-xs font-bold text-white bg-yellow-400 px-2 py-1 rounded-full" id="count-warning">0</span>
            </label>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // -----------------------------------------------------------------
        // 1. จำลองข้อมูลพื้นที่และจุดน้ำท่วม (Mock Database / API Data)
        // -----------------------------------------------------------------
        const districtsData = {
            rayong: [
                { id: "mueang", name: "เมืองระยอง" },
                { id: "pluak_daeng", name: "ปลวกแดง" },
                { id: "klaeng", name: "แกลง" }
            ],
            chonburi: [
                { id: "mueang", name: "เมืองชลบุรี" },
                { id: "si_racha", name: "ศรีราชา" },
                { id: "bang_lamung", name: "บางละมุง" }
            ]
        };

        const allFloodPoints = [
            // ระยอง
            { lat: 12.68, lng: 101.28, province: "rayong", district: "mueang", severity: "heavy", name: "แยก PMY" },
            { lat: 12.65, lng: 101.25, province: "rayong", district: "mueang", severity: "warning", name: "หาดแสงจันทร์" },
            { lat: 12.98, lng: 101.21, province: "rayong", district: "pluak_daeng", severity: "heavy", name: "นิคมอุตสาหกรรม" },
            { lat: 12.78, lng: 101.65, province: "rayong", district: "klaeng", severity: "flooded", name: "ตลาดแกลง" },
            // ชลบุรี
            { lat: 13.16, lng: 100.93, province: "chonburi", district: "si_racha", severity: "heavy", name: "เกาะลอย" },
            { lat: 13.10, lng: 100.91, province: "chonburi", district: "si_racha", severity: "flooded", name: "อ่าวอุดม" },
            { lat: 12.93, lng: 100.88, province: "chonburi", district: "bang_lamung", severity: "heavy", name: "พัทยากลาง" },
            { lat: 12.89, lng: 100.87, province: "chonburi", district: "bang_lamung", severity: "warning", name: "จอมเทียน" },
            { lat: 13.36, lng: 100.98, province: "chonburi", district: "mueang", severity: "flooded", name: "บางแสน" }
        ];

        // -----------------------------------------------------------------
        // 2. ตั้งค่าแผนที่ (Initialize Map)
        // -----------------------------------------------------------------
        const map = L.map('map', {
            zoomControl: false // ปิดปุ่มซูมอันเดิมเพื่อย้ายตำแหน่ง
        }).setView([12.8, 101.1], 10); // ตั้งจุดเริ่มต้นที่ภาคตะวันออก

        // ย้ายปุ่ม Zoom ไปขวาบน ไม่ให้ทับ Sidebar
        L.control.zoom({ position: 'topright' }).addTo(map);

        // ✅ ใช้ CartoDB Positron แทน OpenStreetMap เพื่อแก้ปัญหา 403 Access Blocked
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // LayerGroup สำหรับเก็บหมุดทั้งหมด (เพื่อให้ลบ/วาดใหม่ได้ง่าย)
        const markerGroup = L.layerGroup().addTo(map);

        // -----------------------------------------------------------------
        // 3. ฟังก์ชันการทำงาน (Logic)
        // -----------------------------------------------------------------
        
        // ฟังก์ชันสร้าง Icon ตามระดับความรุนแรง
        function getCustomIcon(severity) {
            let className = '';
            if (severity === 'heavy') className = 'marker-heavy';
            else if (severity === 'flooded') className = 'marker-flooded';
            else if (severity === 'warning') className = 'marker-warning';

            return L.divIcon({
                className: `flood-marker ${className}`,
                iconSize: null // ใช้ขนาดจาก CSS
            });
        }

        // ฟังก์ชันอัปเดตอำเภอเมื่อเลือกจังหวัด
        function updateDistrictDropdown(province) {
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.innerHTML = '<option value="all">ทุกอำเภอ</option>';
            
            if (province === 'all') {
                districtSelect.disabled = true;
                return;
            }

            districtSelect.disabled = false;
            const districts = districtsData[province];
            districts.forEach(d => {
                districtSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
            });
        }

        // ฟังก์ชันอัปเดตตัวเลขจำนวนจุดบน UI
        function updateCounts(counts) {
            document.getElementById('count-heavy').innerText = counts.heavy || 0;
            document.getElementById('count-flooded').innerText = counts.flooded || 0;
            document.getElementById('count-warning').innerText = counts.warning || 0;
        }

        // ฟังก์ชันหลัก: กรองและวาดจุดลงบนแผนที่ (จำลอง API)
        function renderMapData() {
            const selectedProvince = document.getElementById('provinceSelect').value;
            const selectedDistrict = document.getElementById('districtSelect').value;
            
            // หาว่าตอนนี้ Checkbox สีไหนถูกติ๊กอยู่บ้าง
            const activeSeverities = Array.from(document.querySelectorAll('.severity-filter:checked')).map(cb => cb.value);

            markerGroup.clearLayers(); // ลบหมุดเก่าออกให้หมดก่อน

            let filteredPoints = allFloodPoints;
            let bounds = []; // เก็บพิกัดเพื่อซูมให้พอดี

            // กรองตามจังหวัด
            if (selectedProvince !== 'all') {
                filteredPoints = filteredPoints.filter(p => p.province === selectedProvince);
            }
            // กรองตามอำเภอ
            if (selectedDistrict !== 'all' && selectedProvince !== 'all') {
                filteredPoints = filteredPoints.filter(p => p.district === selectedDistrict);
            }

            // นับจำนวนก่อนกรอง Severity เพื่อแสดงบน Sidebar
            let counts = { heavy: 0, flooded: 0, warning: 0 };
            filteredPoints.forEach(p => { counts[p.severity]++; });
            updateCounts(counts);

            // กรองจุดตาม Checkbox ความรุนแรงที่เลือก
            filteredPoints = filteredPoints.filter(p => activeSeverities.includes(p.severity));

            // วาดหมุดใหม่ลงไป
            filteredPoints.forEach(p => {
                const marker = L.marker([p.lat, p.lng], { icon: getCustomIcon(p.severity) })
                    .bindPopup(`<b>${p.name}</b><br>ระดับ: ${p.severity}`);
                markerGroup.addLayer(marker);
                bounds.push([p.lat, p.lng]);
            });

            // ปรับมุมกล้องซูมให้เห็นจุดทั้งหมดพอดี
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
            }
        }

        // -----------------------------------------------------------------
        // 4. ผูก Event Listeners เมื่อมีการกดเมนูต่างๆ
        // -----------------------------------------------------------------
        document.getElementById('provinceSelect').addEventListener('change', (e) => {
            updateDistrictDropdown(e.target.value);
            renderMapData();
        });

        document.getElementById('districtSelect').addEventListener('change', renderMapData);

        document.querySelectorAll('.severity-filter').forEach(checkbox => {
            checkbox.addEventListener('change', renderMapData);
        });

        // โหลดข้อมูลครั้งแรกเมื่อเปิดเว็บ
        renderMapData();

    </script>
</body>
</html>
